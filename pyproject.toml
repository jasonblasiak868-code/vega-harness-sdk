[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-harness-sdk"
version = "0.1.0"
description = "Harness: deterministic Conductor, pre-registered predicted path, library use gates and the pre-execution reasoning pipeline."
requires-python = ">=3.10"
dependencies = ["vega-custody-sdk", "vega-governance-jacket-sdk", "vega-librarian-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
